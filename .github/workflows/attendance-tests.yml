name: Attendance regression tests
on:
  pull_request:
  push:
    branches: [main, fix/manual-attendance-firebase]
permissions:
  contents: read
jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Demo project only: no production credentials, imports, writes, or deployment.
      - run: npm run test:emulator
